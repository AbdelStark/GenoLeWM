site_name: GenoLeWM
site_url: https://abdelstark.github.io/GenoLeWM/
site_description: >-
  Action-conditioned JEPA world model for DNA, built on Carbon.
site_author: GenoLeWM Authors
repo_url: https://github.com/AbdelStark/GenoLeWM
repo_name: AbdelStark/GenoLeWM
edit_uri: edit/main/docs/
copyright: >-
  Copyright &copy; GenoLeWM Authors —
  <a href="https://github.com/AbdelStark/GenoLeWM/blob/main/LICENSE">Apache-2.0</a>.

docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.action.view
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/AbdelStark/GenoLeWM
  version:
    provider: mike
    default: latest

plugins:
  - search
  - section-index
  - literate-nav:
      nav_file: SUMMARY.md
  - gen-files:
      scripts:
        - docs/_gen/build_api_ref.py
        - docs/_gen/build_registry_pages.py
        - docs/_gen/build_repo_pages.py
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: ["."]
          options:
            docstring_style: google
            docstring_section_style: spacy
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_root_members_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_signature_annotations: true
            separate_signature: true
            line_length: 88
            merge_init_into_class: true
            members_order: source

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Architecture: architecture.md
  - API:
      - Public API contract: api/public-surface.md
      - Stability decorators: api/experimental.md
      - Metrics: api/metrics.md
      - Reference: reference/
  - Guides:
      - Glossary: glossary.md
      - FAQ: faq.md
      - Maintainers: maintainers.md
  - Research:
      - GenoLeWM-FX contract: research/fx-experiment-contract.md
      - GenoLeWM-FX feasibility report: research/fx-feasibility-report.md
      - GenoLeWM-FX decision package: research/fx-decision-package.md
  - Blog:
      - What does this edit do? (explainer): blogposts/genolewm_explainer.md
  - Release:
      - Hugging Face model card: release/huggingface-model-card.md
      - Signing keys: release/signing-keys.md
  - Community:
      - Contributing: contributing.md
      - Code of Conduct: code-of-conduct.md
      - Security policy: security.md
      - Privacy: privacy.md
      - Changelog: changelog.md
