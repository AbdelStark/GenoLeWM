# Carbon-backed correction-control smoke run.
#
# This is a bounded clean-machine execution contract, not a model-quality or
# determinism result. It exercises the corrected L2-normalized encoder state
# path for 50 Phase-1 optimizer steps on the pinned Carbon runtime.

run_id: correction-control-l2-p1-smoke-v1
seed: 104729
phase: phase1
deterministic: true
schema_version: 1.1.0

encoder:
  model_id: /carbon
  revision: 5d31d59b3c845b288a13aedb1358934196852eec
  dtype: bf16
  state_layer: 20
  pool_type: centered_mean
  pool_radius: 8
  normalize: true
  state_contract_version: l2_normalized_v2
  # Tokenization is provided by GenoLeWM's pinned local pure-DNA runtime.
  trust_remote_code: false

predictor:
  architecture: cross_attention
  n_layers: 6
  n_heads: 8
  d_state: 1024
  d_action: 64
  # The current trainer keeps predictor/action parameters and batch states in FP32.
  dtype: fp32

action:
  d_action: 64
  max_len: 16
  sub_encoders:
    - snv

training:
  max_steps: 50
  collapse_log_every_steps: 10

optimizer:
  name: adamw
  # The first normalized-state H200 proof showed that 3e-4 destabilized the
  # identity initialization and tripped variance-collapse alerts. Keep this
  # bounded proof conservative; model-selection runs require a separate sweep.
  lr: 3.0e-5
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.1
  grad_clip: 1.0
  warmup_steps: 10
  schedule: wsd

data:
  corpus_id: HuggingFaceBio/carbon-pretraining-corpus
  corpus_revision: cb4c13a78102933b3a6ac65734d326f7b431d9b7
  batch_size: 8
  num_workers: 0
  # The current single-process launcher walks the finite snapshot directly.
  shuffle_buffer: 0

eval:
  benchmarks:
    - clinvar_coding
    - clinvar_noncoding
    - rollout
  smoke_variants: 100

observability:
  log_level: info
  redaction_strict: true
  wandb_project: null

runtime:
  backend: torch
  device: cuda
