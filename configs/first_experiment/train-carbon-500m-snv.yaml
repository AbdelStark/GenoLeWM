# GenoLeWM first-experiment Carbon-backed training config.
#
# This is the checked config intended for the first paper run. The coherent
# release jobs mount Carbon-500M at /carbon for train, eval, and demo so the
# committed config is the single runtime commitment:
#
#   geno-lewm-train --carbon-preflight \
#     --dataset-dir ARTIFACTS/dataset \
#     --carbon-model-dir /carbon \
#     --training-config configs/first_experiment/train-carbon-500m-snv.yaml \
#     --run-dir runs/first-snv-carbon-500m-r1

run_id: first-snv-carbon-500m-r1
seed: 104729
phase: phase1
deterministic: true
schema_version: 1.1.0

encoder:
  model_id: /carbon
  # Pinned Carbon-500M commit for reproducibility (apache-2.0, llama arch).
  revision: 5d31d59b3c845b288a13aedb1358934196852eec
  dtype: bf16
  state_layer: 20
  pool_type: centered_mean
  pool_radius: 8
  normalize: true
  # Historical v0.1 lineage: normalize was configured but ignored in code.
  state_contract_version: legacy_raw_v1
  # Historical release config. The corrected wrapper does not execute Carbon's
  # custom tokenizer; it uses the committed local pure-DNA implementation.
  trust_remote_code: true

predictor:
  architecture: cross_attention
  n_layers: 6
  n_heads: 8
  # Must equal the Carbon encoder output width. Carbon-500M is a llama-arch
  # model with hidden_size=1024, so the pooled state width is 1024; the trainer
  # fails closed if this disagrees with the encoder's observed output.
  d_state: 1024
  d_action: 64
  dtype: bf16

action:
  d_action: 64
  max_len: 16
  sub_encoders:
    - snv

training:
  # Real Carbon-backed run horizon. Fixture smoke runs use the CLI --steps
  # control separately and do not redefine this first-experiment horizon.
  max_steps: 20000
  collapse_log_every_steps: 500

optimizer:
  name: adamw
  lr: 3.0e-4
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.1
  grad_clip: 1.0
  # WSD warmup. The configured real-run horizon must exceed warmup_steps for
  # the schedule to enter its stable and decay phases.
  warmup_steps: 1000
  schedule: wsd

data:
  corpus_id: HuggingFaceBio/carbon-pretraining-corpus
  # Pinned Carbon pretraining-corpus commit (matches the dataset snapshot spec).
  corpus_revision: cb4c13a78102933b3a6ac65734d326f7b431d9b7
  batch_size: 8
  num_workers: 0
  shuffle_buffer: 4096

eval:
  benchmarks:
    - clinvar_coding
    - clinvar_noncoding
    - rollout
  smoke_variants: 1000

observability:
  log_level: info
  redaction_strict: true
  wandb_project: null

runtime:
  backend: torch
  # First paper training is a CUDA GPU job; preflight rejects cpu-only launch
  # configs for this Carbon-backed run.
  device: cuda
