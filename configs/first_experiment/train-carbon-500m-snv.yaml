# GenoLeWM first-experiment Carbon-backed training config.
#
# This is the checked config intended for the first paper run. Runtime-specific
# paths stay on the command line so the same file can be used across machines:
#
#   geno-lewm-train --carbon-preflight \
#     --dataset-dir ARTIFACTS/dataset \
#     --carbon-model-dir ARTIFACTS/carbon-500m \
#     --training-config configs/first_experiment/train-carbon-500m-snv.yaml \
#     --run-dir runs/first-snv-carbon-500m-r1

run_id: first-snv-carbon-500m-r1
seed: 104729
phase: phase1
deterministic: true
schema_version: 1.0.0

encoder:
  model_id: HuggingFaceBio/Carbon-500M
  revision: main
  dtype: bf16
  state_layer: 20
  pool_type: centered_mean
  pool_radius: 8
  normalize: true

predictor:
  architecture: cross_attention
  n_layers: 6
  n_heads: 8
  d_state: 512
  d_action: 64
  dtype: bf16

action:
  d_action: 64
  max_len: 16
  sub_encoders:
    - snv

optimizer:
  name: adamw
  lr: 3.0e-4
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.1
  grad_clip: 1.0
  warmup_steps: 1000
  schedule: wsd

data:
  corpus_id: HuggingFaceBio/carbon-pretraining-corpus
  corpus_revision: main
  batch_size: 8
  num_workers: 0
  shuffle_buffer: 4096

eval:
  benchmarks:
    - clinvar_coding
    - clinvar_noncoding
    - rollout
  smoke_variants: 1000

observability:
  log_level: info
  redaction_strict: true
  wandb_project: null

runtime:
  backend: torch
  device: cpu
