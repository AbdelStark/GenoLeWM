# GenoLeWM first-experiment Carbon-backed training config.
#
# This is the checked config intended for the first paper run. Runtime-specific
# paths stay on the command line so the same file can be used across machines:
#
#   geno-lewm-train --carbon-preflight \
#     --dataset-dir ARTIFACTS/dataset \
#     --carbon-model-dir ARTIFACTS/carbon-500m \
#     --training-config configs/first_experiment/train-carbon-500m-snv.yaml \
#     --run-dir runs/first-snv-carbon-500m-r1

run_id: first-snv-carbon-500m-r1
seed: 104729
phase: phase1
deterministic: true
schema_version: 1.0.0

encoder:
  model_id: HuggingFaceBio/Carbon-500M
  # Pinned Carbon-500M commit for reproducibility (apache-2.0, llama arch).
  revision: 5d31d59b3c845b288a13aedb1358934196852eec
  dtype: bf16
  state_layer: 20
  pool_type: centered_mean
  pool_radius: 8
  normalize: true
  # Carbon-500M ships a custom HybridDNATokenizer; Transformers needs this to
  # load it. Safe here because encoder.revision pins the exact commit.
  trust_remote_code: true

predictor:
  architecture: cross_attention
  n_layers: 6
  n_heads: 8
  # Must equal the Carbon encoder output width. Carbon-500M is a llama-arch
  # model with hidden_size=1024, so the pooled state width is 1024; the trainer
  # fails closed if this disagrees with the encoder's observed output.
  d_state: 1024
  d_action: 64
  dtype: bf16

action:
  d_action: 64
  max_len: 16
  sub_encoders:
    - snv

optimizer:
  name: adamw
  lr: 3.0e-4
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.1
  grad_clip: 1.0
  # WSD warmup. The real-run horizon is passed on the CLI as --steps and
  # MUST exceed warmup_steps for the schedule to enter its stable+decay phases
  # (the first paper run targets --steps 20000); the fixture smoke path uses a
  # small --steps intentionally and does not decay.
  warmup_steps: 1000
  schedule: wsd

data:
  corpus_id: HuggingFaceBio/carbon-pretraining-corpus
  # Pinned Carbon pretraining-corpus commit (matches the dataset snapshot spec).
  corpus_revision: cb4c13a78102933b3a6ac65734d326f7b431d9b7
  batch_size: 8
  num_workers: 0
  shuffle_buffer: 4096

eval:
  benchmarks:
    - clinvar_coding
    - clinvar_noncoding
    - rollout
  smoke_variants: 1000

observability:
  log_level: info
  redaction_strict: true
  wandb_project: null

runtime:
  backend: torch
  device: cpu
