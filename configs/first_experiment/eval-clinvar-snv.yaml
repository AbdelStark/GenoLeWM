# GenoLeWM first-experiment ClinVar evaluation config.
#
# The eval CLI records paths and artifact identities through explicit command
# flags. This checked config fixes the shared model/data/runtime choices for
# the first paper metrics run.

run_id: first-snv-clinvar-eval-r1
seed: 104729
phase: phase1
deterministic: true
schema_version: 1.0.0

encoder:
  model_id: HuggingFaceBio/Carbon-500M
  revision: main
  dtype: bf16
  state_layer: 20
  pool_type: centered_mean
  pool_radius: 8
  normalize: true

predictor:
  architecture: cross_attention
  n_layers: 6
  n_heads: 8
  d_state: 512
  d_action: 64
  dtype: bf16

action:
  d_action: 64
  max_len: 16
  sub_encoders:
    - snv

optimizer:
  name: adamw
  lr: 0.0
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.0
  grad_clip: 0.0
  warmup_steps: 0
  schedule: constant

data:
  corpus_id: HuggingFaceBio/carbon-pretraining-corpus
  corpus_revision: main
  batch_size: 32
  num_workers: 0
  shuffle_buffer: 0

eval:
  benchmarks:
    - clinvar_coding
    - clinvar_noncoding
    - rollout
  smoke_variants: 1000

observability:
  log_level: info
  redaction_strict: true
  wandb_project: null

runtime:
  backend: torch
  device: cpu
