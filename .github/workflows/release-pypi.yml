# PyPI release workflow: tag -> locked build -> trusted publish -> release assets.
#
# Triggers:
#   - push of a vX.Y.Z / vX.Y.Z.devN / vX.Y.ZaN / vX.Y.ZbN / vX.Y.ZrcN tag
#     publishes to PyPI and creates a GitHub release.
#   - manual dispatch publishes the same locked artifacts to TestPyPI only.
#
# Intended to use PyPI Trusted Publishing (OIDC). If the PyPI
# account-side trusted-publisher mapping is missing, maintainers may
# publish the validated dist/ files with a scoped token and must record
# that fallback in the release tracker and notes.
name: Release PyPI

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+.dev[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+a[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+b[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish the locked build"
        required: true
        default: "testpypi"
        type: choice
        options:
          - testpypi

concurrency:
  group: release-pypi-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  UV_VERSION: "0.9.18"

jobs:
  build:
    name: Build distributions from lockfile
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install pinned uv
        run: python -m pip install "uv==${UV_VERSION}"

      - name: Verify lockfile is current
        run: uv lock --check

      - name: Sync locked build environment
        run: uv sync --locked --extra dev

      - name: Check first-experiment dataset spec
        run: >-
          uv run python -m tools.release.dataset_snapshot
          --spec-json configs/first_experiment/dataset-snapshot-snv.json
          --check-spec

      - name: Check correction-control dataset spec
        run: >-
          uv run python -m tools.release.dataset_snapshot
          --spec-json configs/correction_control/dataset-snapshot-snv-l2-smoke-v1.json
          --check-spec

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF##*/}"
          tag="${tag#v}"
          pkg=$(uv run python -c "import geno_lewm; print(geno_lewm.__version__)")
          echo "tag=$tag pkg=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $tag does not match package version $pkg"
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv run python -m build

      - name: Twine check
        run: uv run twine check --strict dist/*

      - name: Check sdist release assets
        run: uv run python -m tools.release.check_sdist_assets dist/*.tar.gz

      - name: Compute artifact digests
        run: |
          cd dist
          sha256sum *.tar.gz *.whl > SHA256SUMS

      - name: Publish release build provenance
        uses: actions/attest-build-provenance@v4.1.0
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.whl
            dist/SHA256SUMS

      - name: Upload Python distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: |
            dist/*.tar.gz
            dist/*.whl
          retention-days: 30

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: dist/
          retention-days: 30

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/geno-lewm
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/geno-lewm
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: false

  github-release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: dist/

      - name: Extract release notes
        id: notes
        run: |
          tag="${GITHUB_REF##*/}"
          version="${tag#v}"
          {
            echo "## ${version}"
            echo ""
            awk -v v="$version" '
              /^## \[/{
                if (capture) exit
                if (index($0, "[" v "]")) { capture=1; next }
              }
              capture' CHANGELOG.md
            echo ""
            echo "Artifact provenance is published through GitHub/Sigstore build provenance."
            echo "Verify locally with the GitHub CLI provenance verification command."
          } > release_notes.md
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.notes.outputs.tag }}" \
            --title "GenoLeWM ${{ steps.notes.outputs.tag }}" \
            --notes-file release_notes.md \
            --verify-tag \
            dist/*
