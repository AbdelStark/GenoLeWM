# Per-PR enforcement of the error + observability contracts
# (RFC-0012 §3.3, RFC-0013 INV-OBS-1/2, RFC-0015 §3.4), plus the
# public-API snapshot gate (RFC-0014 §3.7).
#
# Standalone workflow on purpose: keeps the checks live before the full
# per-PR CI workflow (#86) lands and stays low-overhead. When #86
# arrives, these jobs can fold into it or remain as fast, dependency-free
# fences.
name: lint

on:
  pull_request:
    paths:
      - "geno_lewm/**"
      - "tools/**"
      - "tests/api/**"
      - ".github/workflows/lint-errors.yml"
  push:
    branches: [main]

jobs:
  check-error-codes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run check_error_codes
        run: python -m tools.lint.check_error_codes

  check-event-names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run check_event_names
        run: python -m tools.lint.check_event_names

  check-public-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Diff committed snapshot vs current surface
        run: python -m tools.api.snapshot check
