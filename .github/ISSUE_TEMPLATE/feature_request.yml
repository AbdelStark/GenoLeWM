name: Feature request
description: Propose a feature
title: "feature: "
labels: ["type:feature", "triage:reviewed"]
body:
  - type: markdown
    attributes:
      value: |
        Keep proposals tied to user workflows, reproducible artifacts,
        or measured benchmark gaps.
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What problem does this solve? Link relevant docs or artifacts where applicable.
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: Proposed design
      description: A short implementation sketch.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Data or benchmark evidence
        - Training or evaluation
        - Runtime or scoring
        - Planning or rollout
        - Documentation or release artifact
        - Other
    validations:
      required: true
