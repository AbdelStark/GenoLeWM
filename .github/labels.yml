# Priority
- name: "priority:high"
  description: Should land within the current iteration.
  color: b60205
- name: "priority:medium"
  description: Should land within the current phase.
  color: e99695
- name: "priority:low"
  description: Nice-to-have.
  color: fbca04

# Effort
- name: "effort:small"
  description: One sitting.
  color: 0e8a16
- name: "effort:medium"
  description: A few days.
  color: fbca04
- name: "effort:large"
  description: One or more weeks.
  color: b60205

# Status
- name: "status:blocked"
  color: 5319e7
- name: "status:in-progress"
  color: 1d76db
- name: "status:in-review"
  color: 1d76db
- name: "status:waiting-on-author"
  color: e99695

# Good first / help-wanted
- name: "good first issue"
  description: A new contributor's onboarding ramp.
  color: 7057ff
- name: "help wanted"
  color: 008672
