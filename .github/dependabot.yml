version: 2
updates:
  # Python dependencies (pyproject.toml).
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "type:dependency"
      - "triage:reviewed"
    groups:
      python-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
      python-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: "deps"
      include: "scope"

  # GitHub Actions.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "type:ci"
      - "triage:reviewed"
    groups:
      actions:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "ci"
      include: "scope"
