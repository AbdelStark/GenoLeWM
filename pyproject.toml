[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "geno-lewm"
version = "0.1.0-draft"
description = "Action-conditioned JEPA world model for DNA, built on Carbon."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "GenoLeWM Authors" },
]
keywords = [
    "jepa",
    "world-model",
    "dna",
    "genomics",
    "carbon",
    "variant-effect-prediction",
    "personal-genome",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.3",
    "transformers>=4.45",
    "safetensors>=0.4",
    "datasets>=2.20",
    "numpy>=1.26",
    "pyarrow>=15",
    "polars>=1.0",
    "tqdm>=4.66",
    "hydra-core>=1.3",
    "scikit-learn>=1.4",
    "scipy>=1.12",
]

[project.optional-dependencies]
train = [
    "wandb>=0.17",
    "accelerate>=0.30",
    "deepspeed>=0.14",
]
eval = [
    "pysam>=0.22",
    "cyvcf2>=0.30",
]
deploy = [
    "onnx>=1.16",
    "onnxruntime>=1.18",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.scripts]
geno-lewm-train = "geno_lewm.cli.train:main"
geno-lewm-score = "geno_lewm.cli.score:main"
geno-lewm-rollout = "geno_lewm.cli.rollout:main"
geno-lewm-plan = "geno_lewm.cli.plan:main"

[project.urls]
Homepage = "https://github.com/AbdelStark/geno-lewm"
Documentation = "https://github.com/AbdelStark/geno-lewm/blob/main/SPECIFICATION.md"
Issues = "https://github.com/AbdelStark/geno-lewm/issues"

[tool.hatch.build.targets.wheel]
packages = ["geno_lewm"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]
ignore = ["E501"]  # let formatter handle long lines

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
