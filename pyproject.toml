[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "geno-lewm"
dynamic = ["version"]
description = "Action-conditioned JEPA world model for DNA, built on Carbon."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "GenoLeWM Authors" },
]
maintainers = [
    { name = "AbdelStark" },
]
keywords = [
    "jepa",
    "world-model",
    "dna",
    "genomics",
    "carbon",
    "variant-effect-prediction",
    "personal-genome",
    "machine-learning",
    "bioinformatics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

# Core dependencies are intentionally minimal. The implemented surface
# (errors, observability, redaction, provenance receipts, action specs,
# verify CLI, dispatcher) keeps heavyweight ML deps in the `train` /
# `eval` / `deploy` extras.
dependencies = [
    "typer>=0.12",
    "pyyaml>=6",
]

[project.optional-dependencies]
train = [
    "torch>=2.3",
    "transformers>=4.45",
    "safetensors>=0.4",
    "datasets>=2.20",
    "numpy>=1.26",
    "pyarrow>=15",
    "polars>=1.0",
    "tqdm>=4.66",
    "hydra-core>=1.3",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "wandb>=0.17",
    "accelerate>=0.30",
]
eval = [
    "pysam>=0.22",
    "cyvcf2>=0.30",
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.4",
]
deploy = [
    "onnx>=1.16",
    "onnxruntime>=1.18",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-xdist>=3.6",
    "pytest-benchmark>=4",
    "hypothesis>=6.100",
    "pyarrow>=15",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6",
    "pre-commit>=3.7",
    "build>=1.2",
    "twine>=5.1",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "mkdocs-gen-files>=0.5",
    "mkdocs-literate-nav>=0.6",
    "mkdocs-section-index>=0.3",
    "pymdown-extensions>=10.8",
]
all = [
    "geno-lewm[train,eval,deploy]",
]

[project.scripts]
# Stable identifiers — renaming any of these is a MAJOR change
# (RFC-0018 §4.1).
geno-lewm-verify = "geno_lewm.cli.verify:main"
geno-lewm-train = "geno_lewm.cli.train:cli_main"
geno-lewm-score = "geno_lewm.cli.score:cli_main"
geno-lewm-rollout = "geno_lewm.cli.rollout:cli_main"
geno-lewm-plan = "geno_lewm.cli.plan:cli_main"
geno-lewm-eval = "geno_lewm.cli.eval:cli_main"
geno-lewm-eval-all = "geno_lewm.cli.eval_all:cli_main"
geno-lewm-carbon-baseline = "geno_lewm.cli.carbon_baseline:cli_main"
geno-lewm-export = "geno_lewm.cli.export:cli_main"
geno-lewm-cache-windows = "geno_lewm.cli.cache_windows:cli_main"
geno-lewm-prepare-gnomad = "geno_lewm.cli.prepare_gnomad:cli_main"
geno-lewm-prepare-clinvar = "geno_lewm.cli.prepare_clinvar:cli_main"
geno-lewm-update = "geno_lewm.cli.update:cli_main"

[project.urls]
Homepage = "https://github.com/AbdelStark/GenoLeWM"
Documentation = "https://abdelstark.github.io/GenoLeWM/"
Repository = "https://github.com/AbdelStark/GenoLeWM"
Issues = "https://github.com/AbdelStark/GenoLeWM/issues"
Changelog = "https://github.com/AbdelStark/GenoLeWM/blob/main/CHANGELOG.md"
"Specification" = "https://github.com/AbdelStark/GenoLeWM/blob/main/SPEC.md"

# ---------------------------------------------------------------------------
# Hatch build backend
# Version is read from geno_lewm/__init__.py so package metadata cannot
# drift from the runtime ``__version__``.

[tool.hatch.version]
path = "geno_lewm/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["geno_lewm"]

[tool.hatch.build.targets.sdist]
include = [
    "/geno_lewm",
    "/bench",
    "/configs",
    "/tests",
    "/tools",
    "/docs",
    "/desktop/.gitignore",
    "/desktop/README.md",
    "/desktop/index.html",
    "/desktop/package.json",
    "/desktop/pnpm-lock.yaml",
    "/desktop/src",
    "/desktop/src-tauri/.gitignore",
    "/desktop/src-tauri/Cargo.lock",
    "/desktop/src-tauri/Cargo.toml",
    "/desktop/src-tauri/build.rs",
    "/desktop/src-tauri/capabilities",
    "/desktop/src-tauri/icons",
    "/desktop/src-tauri/src",
    "/desktop/src-tauri/tauri.conf.json",
    "/rfcs",
    "/examples",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/SECURITY.md",
    "/CODE_OF_CONDUCT.md",
    "/CONTRIBUTING.md",
    "/PRIVACY.md",
    "/SPEC.md",
    "/SPECIFICATION.md",
    "/ROADMAP.md",
    "/ARCHITECTURE.md",
    "/AGENTS.md",
    "/pyproject.toml",
]

# ---------------------------------------------------------------------------
# Ruff — linter + formatter (single tool, fast).

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "build", "dist", "site"]

[tool.ruff.lint]
select = [
    "E",       # pycodestyle errors
    "W",       # pycodestyle warnings
    "F",       # Pyflakes
    "I",       # isort
    "B",       # flake8-bugbear
    "C4",      # flake8-comprehensions
    "UP",      # pyupgrade
    "N",       # pep8-naming
    "RUF",     # ruff-specific
    "SIM",     # flake8-simplify
    "PIE",     # flake8-pie
    "PTH",     # flake8-use-pathlib
    "TID",     # flake8-tidy-imports
    "ARG",     # flake8-unused-arguments
    "PL",      # pylint
    "PERF",    # perflint
    "FURB",    # refurb
    "LOG",     # flake8-logging
    "ASYNC",   # flake8-async
]
ignore = [
    "E501",    # line length handled by formatter
    "N818",    # InvariantViolation is intentional (RFC-0012)
    "PLR2004", # magic-value-comparison: too noisy in tests/spec code
    "PLR0911", # too many return statements
    "PLR0912", # too many branches
    "PLR0913", # too many arguments
    "PLR0915", # too many statements
    "PLC0415", # local imports are deliberate (avoid cycles, lazy heavy deps)
    "SIM108",  # ternary not always clearer
    "RUF002",  # ambiguous unicode (en-dashes are intentional in prose)
    "RUF003",  # ambiguous unicode in comments
    "PERF203", # try-except in a loop: deliberate in some helpers
    "TID252",  # relative imports allowed inside the package
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "PLR2004",  # magic numbers in tests are fine
    "ARG001",   # fixtures are passed but unused in some tests
    "ARG002",   # ditto
    "B011",     # assert False in tests
    "SIM117",   # nested context managers in tests
    "PT011",    # pytest.raises without match
    "S101",     # assert is the point
    "PLC0415",  # imports inside tests
]
"docs/**" = ["ALL"]
"rfcs/**" = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["geno_lewm", "tools"]
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

# ---------------------------------------------------------------------------
# Mypy — strict typing on the public package.

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_unimported = false
namespace_packages = true
explicit_package_bases = true
files = ["geno_lewm", "tools"]
exclude = "^(build|dist|site|\\.venv)/"

# Tests are not part of mypy's strict checking surface today; they
# import the strictly-typed package and exercise it with synthetic
# fixtures.

# ---------------------------------------------------------------------------
# Pytest — strict warning policy.

[tool.pytest.ini_options]
minversion = "8"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "--tb=short",
    # Microbenchmarks (tests/benchmark/) are deselected by default
    # via the ``bench`` marker; the nightly job opts in with
    # `pytest tests/benchmark/ -m bench --benchmark-only`.
    "-m",
    "not bench",
]
filterwarnings = [
    "error",
    # Allow the deliberately-emitted experimental/deprecated warnings
    # from geno_lewm.api in test fixtures that exercise them.
    "ignore::FutureWarning:geno_lewm\\.api",
    "ignore::DeprecationWarning:geno_lewm\\.api",
    # pytest-benchmark prints a warning at session start when xdist is
    # active because parallel timings are unreliable. We deselect the
    # ``bench`` marker by default and only run microbenchmarks
    # serially in the nightly job; the warning is spurious here.
    "ignore::pytest_benchmark.logger.PytestBenchmarkWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
    "property: marks property-based tests",
    "bench: pytest-benchmark microbenchmarks (RFC-0016 §3.5; nightly only)",
]
xfail_strict = true

# ---------------------------------------------------------------------------
# Coverage configuration. The 95 % target tracks the implemented
# surface; raise as more code lands.

[tool.coverage.run]
branch = true
source = ["geno_lewm"]
omit = [
    "geno_lewm/cli/__main__.py",
    "*/tests/*",
]
parallel = true

[tool.coverage.paths]
source = ["geno_lewm", ".tox/*/lib/python*/site-packages/geno_lewm"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "def __repr__",
    "raise InvariantViolation",
    "raise UnreachableError",
    "\\.\\.\\.",
]
fail_under = 95

[tool.coverage.html]
directory = "htmlcov"
